# containers.conf fragment used ONLY by the rootless podman API socket that the
# wails3-dev distrobox talks to (see ~/.config/systemd/user/podman.service.d/).
# It is not the user's default config; CLI podman and new distrobox boxes are
# unaffected.
#
# Why it exists: Wails' cross-compilation tasks run
#   docker run --rm -v "$ROOT:/app" -v "$GOPATH/pkg/mod:/go/pkg/mod" wails-cross ...
#   docker run --rm -v "$ROOT:/app" alpine chown -R <uid>:<gid> /app/bin
# against this socket. With the default rootless mapping (container root -> host
# uid 1000, container uid 1000 -> subuid) the chown step re-owns the project's
# bin/ directory to a subuid, so the box user can no longer move the binary
# ("mv: Permission denied"). keep-id maps the user's own UID/GID to themselves
# inside the container, which makes the taskfile's chown correct.
#
# label=false: those bind mounts come from $HOME (user_home_t on an SELinux
# host), and a labelled container cannot create files in them. Distrobox runs
# the wails3-dev box itself with label=disable for the same reason.

[containers]
userns = "keep-id"
label = false
